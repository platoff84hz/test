{% extends 'core/base.html' %}

{% block content %}
<h1 class="mb-3">{{ title }}</h1>
<div class="form-panel">
    <p>Удалить запись «{{ object_name }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Удалить</button>
        <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Отмена</a>
    </form>
</div>
{% endblock %}
