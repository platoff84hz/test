{% extends 'core/base.html' %}

{% block content %}
<h1 class="mb-3">Вход в систему</h1>
<form method="post" class="form-panel" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}
    <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Логин</label>
        {{ form.username }}
    </div>
    <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
        {{ form.password }}
    </div>
    <button class="btn btn-primary" type="submit">Войти</button>
</form>
{% endblock %}
